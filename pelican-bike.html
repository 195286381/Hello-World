<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹈鹕骑单车</title>
  <style>
    :root {
      --sky: #dff3ff;
      --road: #4f5d75;
      --road-line: #ffd166;
      --bike: #2d3142;
      --pelican-body: #f8f9fa;
      --pelican-beak: #ff9f1c;
      --pelican-wing: #d9dde3;
      --shadow: rgba(0,0,0,.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, var(--sky) 0 70%, #bde0fe 100%);
    }

    .scene {
      width: min(92vw, 900px);
      aspect-ratio: 16 / 9;
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      box-shadow: 0 16px 35px var(--shadow);
      background:
        radial-gradient(circle at 15% 18%, #ffffff 0 12%, transparent 13%),
        radial-gradient(circle at 32% 14%, #ffffff 0 10%, transparent 11%),
        radial-gradient(circle at 74% 22%, #ffffff 0 13%, transparent 14%),
        linear-gradient(180deg, #dff3ff 0 63%, #8ecae6 64% 100%);
    }

    .road {
      position: absolute;
      inset: auto 0 0 0;
      height: 32%;
      background: var(--road);
    }

    .road::before {
      content: "";
      position: absolute;
      top: 42%;
      left: -10%;
      width: 120%;
      height: 8px;
      background: repeating-linear-gradient(
        90deg,
        transparent 0 60px,
        var(--road-line) 60px 105px
      );
      opacity: .9;
    }

    .bike-wrap {
      position: absolute;
      left: 50%;
      bottom: 16%;
      transform: translateX(-50%);
      width: 430px;
      height: 240px;
      animation: bob 1.6s ease-in-out infinite;
    }

    @keyframes bob {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-4px); }
    }

    .wheel {
      position: absolute;
      bottom: 0;
      width: 112px;
      height: 112px;
      border: 8px solid var(--bike);
      border-radius: 50%;
      background:
        radial-gradient(circle at center, #fff 0 18px, transparent 19px),
        conic-gradient(from 0deg, #adb5bd 0 12deg, transparent 12deg 30deg, #adb5bd 30deg 42deg, transparent 42deg 60deg, #adb5bd 60deg 72deg, transparent 72deg 90deg, #adb5bd 90deg 102deg, transparent 102deg 120deg, #adb5bd 120deg 132deg, transparent 132deg 150deg, #adb5bd 150deg 162deg, transparent 162deg 180deg, #adb5bd 180deg 192deg, transparent 192deg 210deg, #adb5bd 210deg 222deg, transparent 222deg 240deg, #adb5bd 240deg 252deg, transparent 252deg 270deg, #adb5bd 270deg 282deg, transparent 282deg 300deg, #adb5bd 300deg 312deg, transparent 312deg 330deg, #adb5bd 330deg 342deg, transparent 342deg 360deg);
      animation: spin 1.2s linear infinite;
    }

    .wheel.front { right: 32px; }
    .wheel.back { left: 32px; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .frame {
      position: absolute;
      left: 95px;
      right: 95px;
      bottom: 52px;
      height: 80px;
      border-bottom: 8px solid var(--bike);
    }

    .frame::before,
    .frame::after {
      content: "";
      position: absolute;
      width: 8px;
      background: var(--bike);
      transform-origin: bottom;
    }

    .frame::before {
      left: 40px;
      height: 66px;
      transform: rotate(28deg);
      bottom: 0;
    }

    .frame::after {
      right: 48px;
      height: 74px;
      transform: rotate(-36deg);
      bottom: 0;
    }

    .bar,
    .seat {
      position: absolute;
      background: var(--bike);
    }

    .bar {
      right: 112px;
      bottom: 124px;
      width: 70px;
      height: 8px;
      border-radius: 8px;
      transform: rotate(-18deg);
    }

    .seat {
      left: 145px;
      bottom: 122px;
      width: 56px;
      height: 10px;
      border-radius: 10px;
    }

    .pelican {
      position: absolute;
      left: 50%;
      bottom: 98px;
      width: 210px;
      height: 132px;
      transform: translateX(-50%);
    }

    .body {
      position: absolute;
      left: 36px;
      top: 36px;
      width: 130px;
      height: 74px;
      background: var(--pelican-body);
      border-radius: 48% 52% 55% 45% / 62% 62% 38% 38%;
      border: 3px solid #cfd4da;
    }

    .wing {
      position: absolute;
      left: 70px;
      top: 54px;
      width: 76px;
      height: 46px;
      background: var(--pelican-wing);
      border-radius: 55% 45% 56% 44%;
      border: 3px solid #bcc2cb;
      transform: rotate(-11deg);
    }

    .neck {
      position: absolute;
      left: 138px;
      top: 24px;
      width: 26px;
      height: 52px;
      background: var(--pelican-body);
      border: 3px solid #cfd4da;
      border-radius: 40px;
      transform: rotate(10deg);
    }

    .head {
      position: absolute;
      left: 150px;
      top: 2px;
      width: 42px;
      height: 42px;
      background: var(--pelican-body);
      border: 3px solid #cfd4da;
      border-radius: 50%;
    }

    .eye {
      position: absolute;
      left: 173px;
      top: 16px;
      width: 7px;
      height: 7px;
      background: #212529;
      border-radius: 50%;
    }

    .beak {
      position: absolute;
      left: 183px;
      top: 20px;
      width: 44px;
      height: 18px;
      background: var(--pelican-beak);
      border: 3px solid #d97706;
      border-radius: 8px 18px 12px 10px;
      transform: rotate(6deg);
    }

    .leg {
      position: absolute;
      width: 6px;
      height: 36px;
      background: #f4a261;
      bottom: 14px;
      transform-origin: top center;
      animation: pedal 1.2s ease-in-out infinite;
    }

    .leg.left { left: 96px; }
    .leg.right { left: 116px; animation-delay: .6s; }

    @keyframes pedal {
      0%, 100% { transform: rotate(24deg); }
      50% { transform: rotate(-26deg); }
    }

    .caption {
      position: absolute;
      top: 18px;
      left: 0;
      right: 0;
      text-align: center;
      color: #1d3557;
      font-weight: 700;
      letter-spacing: .05em;
      text-shadow: 0 1px 0 #fff;
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="一只鹈鹕正在骑单车的动画场景">
    <div class="caption">鹈鹕骑单车 🚲</div>

    <section class="bike-wrap" aria-hidden="true">
      <div class="wheel back"></div>
      <div class="wheel front"></div>
      <div class="frame"></div>
      <div class="bar"></div>
      <div class="seat"></div>

      <div class="pelican">
        <div class="body"></div>
        <div class="wing"></div>
        <div class="neck"></div>
        <div class="head"></div>
        <div class="eye"></div>
        <div class="beak"></div>
        <div class="leg left"></div>
        <div class="leg right"></div>
      </div>
    </section>

    <div class="road" aria-hidden="true"></div>
  </main>
</body>
</html>
